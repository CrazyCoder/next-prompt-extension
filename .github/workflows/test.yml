# PR CI. The actual checks live in the REUSABLE verify workflow — the single
# source of truth shared with tag publishing (publish.yml), so a tag can
# never publish with checks weaker than PR CI (Step 7).
name: test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

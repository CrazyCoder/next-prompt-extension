# Tag publishing. The verify job calls the SAME reusable workflow as PR CI —
# a tag cannot publish with checks weaker than PR (Step 7 acceptance). The
# tag-specific gates (version match, default-branch ancestry, dated manual
# TUI smoke evidence) run alongside it.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  tag-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          # setup-bun v2 accepts no-cache (not "cache"); explicit no-cache keeps
          # the job hermetic and silences the invalid-input warning.
          no-cache: true
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Verify tag is on the protected default branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not reachable from origin/main" >&2
            exit 1
          fi

      # Step 7 item 6: a release requires a dated manual TUI smoke record for
      # exactly this version (see TUI_SMOKE_TEST.md for the format and the
      # checklist). Without the line, the tag cannot publish.
      - name: Require dated TUI smoke evidence for this version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          grep -E "^Recorded: v${PKG_VERSION} — " TUI_SMOKE_TEST.md || {
            echo "TUI_SMOKE_TEST.md has no dated evidence line for v${PKG_VERSION}." >&2
            echo "Run the full TUI smoke checklist on real Pi and OMP, then append:" >&2
            echo "  Recorded: v${PKG_VERSION} — <date> — Pi <version> (<terminals>) / OMP <version> (<terminals>) — all cases pass" >&2
            exit 1
          }

  publish:
    needs: [verify, tag-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
